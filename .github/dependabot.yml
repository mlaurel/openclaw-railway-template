# Dependabot opens pull requests; it never merges or deploys them. Merging an
# OpenClaw upgrade is a deploy, so follow documentation/UPGRADING.md before merging.
version: 2
updates:
  # Both FROM lines in the Dockerfile: OpenClaw and the Tailscale binaries.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "image"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Type definitions must match the Node major version CI runs (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development-tools:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
    commit-message:
      prefix: "tools"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
